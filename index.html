<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pastel Ring Escape</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6e8ef}canvas{width:100%;height:100%;display:block}
</style></head><body><canvas id="c"></canvas><script>
(()=>{'use strict';
const TAU=Math.PI*2,V=45,cv=document.querySelector('canvas'),ctx=cv.getContext('2d',{alpha:false}),params=new URLSearchParams(location.search);
let seed=+(params.get('seed'))||734921,r=seed>>>0;const rnd=()=>((r=(1664525*r+1013904223)>>>0)/4294967296);
const N=+(params.get('total'))||400,DURATION=+(params.get('seconds'))||60;
let w,h,d,cx,cy,R,gap,br,gravity,elapsed=0,active=0,offset=0,pulse=0,bounces=0;
let rings=[],particles=[],trail=[],ball={x:0,y:0,vx:0,vy:0},audio,master,noise,lastSound=0,polys=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function initAudio(){if(audio){audio.resume();return}const A=window.AudioContext||window.webkitAudioContext;audio=new A();master=audio.createGain();master.gain.value=.62;const comp=audio.createDynamicsCompressor();master.connect(comp);comp.connect(audio.destination);noise=audio.createBuffer(1,audio.sampleRate*.2|0,audio.sampleRate);const data=noise.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=rnd()*2-1}
function beep(freq,dur,vol,type='triangle'){if(!audio)return;const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(90,freq*.58),now+dur);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.004);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(master);o.start(now);o.stop(now+dur+.01)}
function crack(){if(!audio)return;const now=audio.currentTime,s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();s.buffer=noise;f.type='highpass';f.frequency.value=1800;g.gain.setValueAtTime(.22,now);g.gain.exponentialRampToValueAtTime(.0001,now+.095);s.connect(f);f.connect(g);g.connect(master);s.start(now);s.stop(now+.1);beep(1650+rnd()*900,.075,.11,'square')}
function layout(){d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;cv.width=w*d;cv.height=h*d;cx=w/2;cy=h/2;const m=Math.min(w,h);R=m*.105;gap=(m*.455-R)/(V-1);br=Math.max(7,m*.017);gravity=m*.48;if(!rings.length)reset();makePolys()}
function makePolys(){polys=[];const colors=['#f9dce8','#f9e4d5','#fff8f1','#d9f3ee','#dceefa','#f5e6f0'];const step=Math.max(75,Math.min(w,h)*.19);for(let y=-step;y<h+step;y+=step){for(let x0=-step;x0<w+step;x0+=step){let x=x0+(rnd()-.5)*step*.6,y0=y+(rnd()-.5)*step*.6,ww=step*(.7+rnd()*.65),hh=step*(.7+rnd()*.65);polys.push({pts:[[x,y0],[x+ww,y0+(rnd()-.5)*step*.35],[x+(rnd()-.5)*step*.4,y0+hh]],c:colors[rnd()*colors.length|0],a:.32+rnd()*.34})}}}
function reset(){rings=[];let angle=rnd()*TAU;for(let i=0;i<N;i++){angle+=.115+(rnd()-.5)*.035;rings.push({a:angle,rot:0,w:(rnd()-.5)*.65,half:.32+rnd()*.1})}active=0;offset=0;elapsed=0;bounces=0;particles=[];trail=[];const z=rnd()*TAU,s=R*5.8;ball={x:0,y:0,vx:Math.cos(z)*s,vy:Math.sin(z)*s}}
const radius=i=>R+(i-offset)*gap;
function burst(rad){for(let i=0;i<34;i++){const a=rnd()*TAU,s=(100+rnd()*260)*Math.min(w,h)/720;particles.push({x:Math.cos(a)*rad,y:Math.sin(a)*rad,vx:Math.cos(a)*s,vy:Math.sin(a)*s-35,life:0,max:.48+rnd()*.65,size:.8+rnd()*2.1})}}
function breakRing(){const rad=radius(active);burst(rad);crack();pulse=1;active++;const speed=Math.min(Math.hypot(ball.vx,ball.vy)*1.025,R*13),ang=Math.atan2(ball.vy,ball.vx);ball.vx=Math.cos(ang)*speed;ball.vy=Math.sin(ang)*speed}
function step(dt){if(active>=N)return;const ring=rings[active],rad=radius(active);ball.vy+=gravity*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const dist=Math.hypot(ball.x,ball.y)||.001,a=Math.atan2(ball.y,ball.x),delta=Math.atan2(Math.sin(a-ring.a-ring.rot),Math.cos(a-ring.a-ring.rot));if(dist+br<rad-gap*.12)return;if(Math.abs(delta)<ring.half-br/rad*.48){if(dist>=rad)breakRing();return}
const nx=-ball.x/dist,ny=-ball.y/dist,dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=2*dot*nx;ball.vy-=2*dot*ny}
let speed=clamp(Math.hypot(ball.vx,ball.vy)*.999,R*5.2,R*13),turn=(rnd()<.5?-1:1)*(.12+rnd()*.26);let ang=Math.atan2(ball.vy,ball.vx)+turn;ball.vx=Math.cos(ang)*speed;ball.vy=Math.sin(ang)*speed;const vn=ball.vx*nx+ball.vy*ny;if(vn<speed*.42){ball.vx+=nx*(speed*.42-vn);ball.vy+=ny*(speed*.42-vn)}const maxD=rad-br-gap*.15;ball.x=-nx*maxD;ball.y=-ny*maxD;if(audio&&performance.now()-lastSound>27){beep(380+rnd()*480,.045,.055);lastSound=performance.now()}bounces++}
function update(dt){elapsed+=dt;const factor=1+Math.min(1,active/160)*.22;pulse=Math.max(0,pulse-dt*3);offset+=(active-offset)*Math.min(1,dt*10);for(let i=active;i<Math.min(N,active+V);i++)rings[i].rot+=rings[i].w*dt*factor;const speed=Math.hypot(ball.vx,ball.vy),steps=clamp(Math.ceil(speed*dt/(br*.32)),1,36);for(let i=0;i<steps&&active<N;i++)step(dt/steps);trail.push({x:ball.x,y:ball.y});if(trail.length>16)trail.shift();particles=particles.filter(p=>{p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=gravity*.85*dt;p.vx*=.992;p.vy*=.992;return p.life<p.max})}
function background(){ctx.fillStyle='#f8eee9';ctx.fillRect(0,0,w,h);for(const p of polys){ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.moveTo(...p.pts[0]);ctx.lineTo(...p.pts[1]);ctx.lineTo(...p.pts[2]);ctx.closePath();ctx.fill()}ctx.globalAlpha=1;const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.56);g.addColorStop(0,'rgba(255,255,255,.78)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
function draw(){ctx.setTransform(d,0,0,d,0,0);background();ctx.save();ctx.translate(cx,cy);
for(let i=Math.min(N,active+V)-1;i>=active;i--){const rad=radius(i),ring=rings[i];ctx.beginPath();ctx.arc(0,0,rad,ring.a+ring.rot+ring.half,ring.a+ring.rot+TAU-ring.half);ctx.strokeStyle='rgba(20,24,28,.88)';ctx.lineWidth=Math.max(1.15,Math.min(2.15,R*.025));ctx.lineCap='round';ctx.stroke()}
for(const p of particles){const f=1-p.life/p.max;ctx.globalAlpha=f;ctx.fillStyle='#15191d';ctx.beginPath();ctx.arc(p.x,p.y,p.size*(.45+f),0,TAU);ctx.fill()}ctx.globalAlpha=1;
for(let i=1;i<trail.length;i++){const f=i/trail.length,prev=trail[i-1],cur=trail[i],width=br*(1-f)*1.9;ctx.strokeStyle='rgba(22,27,31,'+(.08+.3*f)+')';ctx.lineWidth=Math.max(.3,width);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(cur.x,cur.y);ctx.stroke()}
ctx.fillStyle='#111518';ctx.beginPath();ctx.arc(ball.x,ball.y,br,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1.5,br*.13);ctx.stroke();
ctx.restore();
const remaining=Math.max(0,N-active),seconds=Math.max(0,Math.ceil(DURATION-elapsed));ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(25,31,34,.82)';ctx.font='700 '+Math.max(18,R*.42)+'px system-ui';ctx.fillText(seconds+'s',cx,cy-R*.38);ctx.font='800 '+Math.max(34,R*1.02)+'px system-ui';ctx.fillText(String(remaining),cx,cy+R*.34);
}
for(let i=0;i<12;i++)rnd();layout();reset();window.__simMeta={seed,total:N,seconds:DURATION};window.__simProgress=()=>({active,total:N,seconds:Math.max(0,Math.ceil(DURATION-elapsed))});window.__simAdvance=(count=2)=>{for(let i=0;i<count&&active<N;i++)update(1/120);draw();return {active,total:N,seconds:Math.max(0,Math.ceil(DURATION-elapsed))}};addEventListener('pointerdown',initAudio);addEventListener('resize',()=>{const old=R;layout();const k=R/old;ball.x*=k;ball.y*=k;ball.vx*=k;ball.vy*=k});if(!params.has('offline')){let last=0,acc=0;function frame(ts){if(!last)last=ts;acc=Math.min(acc+(ts-last)/1000,0.12);last=ts;while(acc>=1/120){update(1/120);acc-=1/120}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame)}else draw();
})();
</script></body></html>
