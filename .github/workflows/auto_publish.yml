name: Ball Escape - Generate and Publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto_publish.yml"
  schedule:
    - cron: "15 */2 * * *"
permissions:
  contents: write
concurrency:
  group: ball-escape-pipeline
  cancel-in-progress: false
jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate video
        run: python src/simulator.py
      - name: Save video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ball-escape-${{ github.run_number }}
          path: |
            output.mp4
            metadata.json
            audio.wav
          retention-days: 7
      - name: Publish MP4 as public release asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="short-$GITHUB_RUN_ID"
          gh release create "$TAG" output.mp4 --repo "$GITHUB_REPOSITORY" --title "Ball Escape $GITHUB_RUN_NUMBER" --notes "Automatically generated short."
          echo "video_url=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/output.mp4" >> "$GITHUB_OUTPUT"
      - name: Schedule on YouTube Shorts and TikTok using Metricool
        env:
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_USER_ID: "6485386"
          METRICOOL_BLOG_ID: "8234676"
          METRICOOL_TIMEZONE: "Asia/Baghdad"
          VIDEO_URL: ${{ steps.release.outputs.video_url }}
        run: python src/publish_metricool.py
