name: Ball Escape - Generate and Publish
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to YouTube (untick to only render a test video)"
        type: boolean
        default: true
      privacy:
        description: "YouTube visibility"
        type: choice
        options: [public, unlisted, private]
        default: public
  schedule:
    # 13:30 and 20:30 Iraq time (UTC+3)
    - cron: "30 10,17 * * *"
permissions:
  contents: read
concurrency:
  group: ball-escape-pipeline
  cancel-in-progress: false
jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Generate video
        run: python src/simulator.py
      - name: Save video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ball-escape-${{ github.run_number }}
          path: |
            output.mp4
            metadata.json
          retention-days: 7
      - name: Publish to YouTube
        if: github.event_name == 'schedule' || inputs.publish
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ inputs.privacy }}
        run: python src/publish_youtube.py
